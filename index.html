<style>
/* Layout: a dark job-sign band (project name, address, workday counter) over an aluminum page;
   content sits left-aligned in a 1120px column; phones get a bottom tab bar. */
:root {
  --page: #e8ecef;
  --surface: #fbfcfc;
  --surface-2: #f0f3f5;
  --ink: #15212c;
  --ink-2: #455463;
  --ink-3: #66737f;
  --rule: #d5dce1;
  --track: #dae1e6;
  --accent: #0b7a75;        /* data: OHP, the crew line, material chips. The same on every project. */
  --accent-ink: #ffffff;
  --accent-soft: #dceeec;
  --brand: #0b7a75;         /* chrome: buttons, links, focus. A project's company recolors these. */
  --brand-ink: #ffffff;
  --brand-text: #0b7a75;    /* the brand as text or an outline on the page (4.5:1 or better) */
  --brand-soft: #dceeec;
  --co-uc: #a13129;         /* company marks on project cards and filters */
  --co-asf: #8cc63f;
  --steel: #22303d;
  --context: #8c99a5;
  --over: #c13a31;
  --over-soft: #f7e0dd;
  --warn: #9a6200;
  --warn-fill: #f2b233;
  --warn-soft: #f8ebcf;
  --good: #2b7a3e;
  --good-soft: #ddefe1;
  --on-over: #ffffff;
  --sign: #17232e;
  --sign-2: #243341;
  --sign-ink: #f3f6f8;
  --sign-ink-2: #afbdc9;
  --sign-accent: #5fd0c8;
  --sign-kicker: var(--sign-ink-2);
  --sign-fill: rgba(255, 255, 255, .04);
  --dot-ok: #4cc27a;
  --dot-busy: #5fd0c8;
  --dot-warn: #f2b233;
  --dot-err: #ff7b72;
  --scrim: rgba(12, 20, 27, .46);
  --shadow: 0 18px 50px rgba(16, 28, 38, .22);
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r-card: 10px;
  --r-ctl: 7px;
  --tabbar-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e1419; --surface: #151d25; --surface-2: #1b2530; --ink: #e5ebf0; --ink-2: #a8b5c1; --ink-3: #7e8c99;
    --rule: #26323d; --track: #2a3743; --accent: #3db3ab; --accent-ink: #062321; --accent-soft: #123532;
    --brand: #3db3ab; --brand-ink: #062321; --brand-text: #3db3ab; --brand-soft: #123532; --co-uc: #c2453b;
    --steel: #d3dde6; --context: #5e6b77; --over: #f06a60; --over-soft: #3a1d1b; --warn: #f2b233; --warn-fill: #f2b233;
    --warn-soft: #3a2e12; --good: #59b86e; --good-soft: #17301d; --on-over: #2a0c0a; --sign: #1a2530; --sign-2: #263543; --sign-ink: #f3f6f8;
    --sign-ink-2: #a9b7c3; --scrim: rgba(0, 0, 0, .6); --shadow: 0 18px 50px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e1419; --surface: #151d25; --surface-2: #1b2530; --ink: #e5ebf0; --ink-2: #a8b5c1; --ink-3: #7e8c99;
  --rule: #26323d; --track: #2a3743; --accent: #3db3ab; --accent-ink: #062321; --accent-soft: #123532;
  --brand: #3db3ab; --brand-ink: #062321; --brand-text: #3db3ab; --brand-soft: #123532; --co-uc: #c2453b;
  --steel: #d3dde6; --context: #5e6b77; --over: #f06a60; --over-soft: #3a1d1b; --warn: #f2b233; --warn-fill: #f2b233;
  --warn-soft: #3a2e12; --good: #59b86e; --good-soft: #17301d; --on-over: #2a0c0a; --sign: #1a2530; --sign-2: #263543; --sign-ink: #f3f6f8;
  --sign-ink-2: #a9b7c3; --scrim: rgba(0, 0, 0, .6); --shadow: 0 18px 50px rgba(0, 0, 0, .5); color-scheme: dark;
}

/* Company themes: the sign, buttons, links and focus rings take the company's colors.
   Data colors (over budget, OHP, the crew line) stay the same on every project. */
:root[data-company="uc"] {   /* Ultimate Construction: wine */
  --sign: #a13129; --sign-2: #bc4a41; --sign-ink: #ffffff; --sign-ink-2: #f3d0cc; --sign-accent: #ffffff;
  --brand: #a13129; --brand-ink: #ffffff; --brand-text: #a13129; --brand-soft: #f6e3e1;
}
:root[data-company="asf"] {  /* Architectural System Fabricators: lime green, dark text on it */
  --sign: #8cc63f; --sign-2: #79b02e; --sign-ink: #142007; --sign-ink-2: #2e4710; --sign-accent: #142007; --sign-kicker: #2e4710;
  --sign-fill: rgba(255, 255, 255, .22); --dot-ok: #1d6b2c; --dot-busy: #0e5f5a; --dot-warn: #7a4f00; --dot-err: #b42318;
  --brand: #8cc63f; --brand-ink: #1a2908; --brand-text: #437013; --brand-soft: #eef6e2;
}
@media (prefers-color-scheme: dark) {
  :root[data-company="uc"]:not([data-theme="light"]) { --sign: #84271f; --sign-2: #9c3a32; --sign-ink-2: #ebc3be; --brand: #b43a31; --brand-text: #f5b3ac; --brand-soft: #3d1f1c; }
  :root[data-company="asf"]:not([data-theme="light"]) { --sign: #2e4517; --sign-2: #44622a; --sign-ink: #ffffff; --sign-ink-2: #c8dcae; --sign-accent: #8cc63f; --sign-kicker: #a6d76c;
    --sign-fill: rgba(255, 255, 255, .04); --dot-ok: #4cc27a; --dot-busy: #5fd0c8; --dot-warn: #f2b233; --dot-err: #ff7b72; --brand-text: #a6d76c; --brand-soft: #222f17; }
}
:root[data-company="uc"][data-theme="dark"] { --sign: #84271f; --sign-2: #9c3a32; --sign-ink-2: #ebc3be; --brand: #b43a31; --brand-text: #f5b3ac; --brand-soft: #3d1f1c; }
:root[data-company="asf"][data-theme="dark"] { --sign: #2e4517; --sign-2: #44622a; --sign-ink: #ffffff; --sign-ink-2: #c8dcae; --sign-accent: #8cc63f; --sign-kicker: #a6d76c;
  --sign-fill: rgba(255, 255, 255, .04); --dot-ok: #4cc27a; --dot-busy: #5fd0c8; --dot-warn: #f2b233; --dot-err: #ff7b72; --brand-text: #a6d76c; --brand-soft: #222f17; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  font-stretch: 100%; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sign); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
a { color: var(--brand-text); text-underline-offset: 2px; }
a.btn { text-decoration: none; }
.num, table td.n, .amt { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cond { font-stretch: 80%; }
.muted { color: var(--ink-3); }
.neg { color: var(--over); }
.zero { color: var(--ink-3); }

/* ---------- job sign ---------- */
.sign { background: var(--sign); color: var(--sign-ink); }
.sign .co { margin: 0 0 7px; font-size: 12.5px; font-weight: 700; font-stretch: 92%; letter-spacing: .09em; text-transform: uppercase; color: var(--sign-kicker); }
.sign .co .cs { display: none; }
.sign .wrap { padding-block: 22px 0; }
.sign-top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.sign h1 { margin: 0; font-size: clamp(23px, 3.6vw, 34px); line-height: 1.06; font-weight: 800; font-stretch: 112%;
  letter-spacing: -.01em; text-wrap: balance; max-width: 30ch; }
.sign .addr { margin: 8px 0 0; color: var(--sign-ink-2); font-size: 14.5px; }
.plates { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 16px; }
.plate { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 11px 7px; border: 1px solid var(--sign-2);
  border-radius: 6px; background: var(--sign-fill); }
.plate .k { font-stretch: 80%; font-size: 12.5px; color: var(--sign-ink-2); letter-spacing: .02em; }
.plate .v { font-weight: 700; font-size: 15px; }
.plate .v.big { font-size: 18px; font-stretch: 105%; }
.sync { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--sign-2); background: transparent;
  color: var(--sign-ink); border-radius: 999px; padding: 6px 12px 6px 10px; font-size: 13px; font-stretch: 90%; white-space: nowrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sign-ink-2); }
.sync[data-state="saved"] .dot { background: var(--dot-ok); }
.sync[data-state="saving"] .dot, .sync[data-state="loading"] .dot { background: var(--dot-busy); animation: pulse 1.1s ease-in-out infinite; }
.sync[data-state="offline"] .dot { background: var(--dot-warn); }
.sync[data-state="error"] .dot { background: var(--dot-err); }
.sync[data-state="preview"] .dot { background: transparent; border: 1.5px solid var(--sign-ink-2); }
@keyframes pulse { 50% { opacity: .35; } }
.sign-actions { display: flex; gap: 8px; align-items: center; flex: none; }
.gear { display: none; width: 36px; height: 34px; border-radius: 999px; border: 1px solid var(--sign-2); background: transparent; color: var(--sign-ink); place-items: center; padding: 0; }
.gear svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gear[aria-current="page"] { background: var(--sign-2); }
.crumb { display: inline-flex; align-items: center; gap: 4px; margin: -4px 0 12px; padding: 5px 13px 5px 7px; border: 1px solid var(--sign-2);
  border-radius: 999px; background: var(--sign-fill); color: var(--sign-ink); font-size: 14px; font-weight: 600; font-stretch: 92%; }
.crumb:hover { background: var(--sign-2); }
.crumb svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tabs { display: flex; gap: 4px; margin-top: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: transparent; color: var(--sign-ink-2); padding: 10px 14px 12px; font-size: 15px; font-weight: 600;
  border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button:hover { color: var(--sign-ink); }
.tabs button[aria-current="page"] { color: var(--sign-ink); border-bottom-color: var(--sign-accent); }
.tabbar { display: none; }

/* ---------- layout ---------- */
.main { padding-block: 22px 64px; outline: none; }
.stack { display: grid; gap: 18px; }
.grid2 { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-card); padding: 18px 20px; min-width: 0; }
.card h2, .sec-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.005em; text-wrap: balance; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head p { margin: 2px 0 0; color: var(--ink-3); font-size: 13.5px; }
.lbl { font-stretch: 80%; font-size: 13px; color: var(--ink-2); letter-spacing: .015em; }
.banner { margin: 16px auto 0; }
.banner .note { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }

/* ---------- buttons & chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 14px;
  border-radius: var(--r-ctl); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font-weight: 600;
  font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--brand-text); padding-inline: 8px; }
.btn.ghost:hover { background: var(--brand-soft); }
.btn.danger { color: var(--over); background: transparent; border-color: transparent; }
.btn.danger.armed { background: var(--over); color: var(--on-over); border-color: var(--over); }
.btn.sm { min-height: 32px; padding: 5px 11px; font-size: 13.5px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2);
  border: 1px solid var(--rule); font-size: 12.5px; font-stretch: 85%; color: var(--ink-2); white-space: nowrap; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; }
.chip.src-material { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.lrow .chip, .mrow .chip { white-space: normal; overflow: visible; border-radius: 10px; line-height: 1.3; padding-block: 2px; }
.chip.src-payroll { background: var(--surface-2); }
.chip.bad { background: var(--over-soft); color: var(--over); border-color: transparent; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; font-stretch: 85%; padding: 2px 8px; border-radius: 4px; }
.pill.over { background: var(--over-soft); color: var(--over); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.mute { background: var(--surface-2); color: var(--ink-2); }
.seg { display: inline-flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 9px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

/* ---------- contract bar (hero) ---------- */
.hero-head { display: flex; justify-content: space-between; gap: 18px 28px; flex-wrap: wrap; align-items: flex-end; }
.hero-fig { font-size: clamp(38px, 6vw, 54px); font-weight: 700; letter-spacing: -.02em; line-height: 1.02; margin-top: 4px; }
.hero-sub { color: var(--ink-3); font-size: 13.5px; margin-top: 6px; }
.hero-side { text-align: right; }
.hero-side .fig { font-size: 26px; font-weight: 700; margin-top: 2px; }
.cbar { display: flex; gap: 2px; height: 22px; margin: 22px 0 14px; }
.cbar > span { display: block; min-width: 3px; height: 100%; }
.cbar > span:first-child { border-radius: 4px 0 0 4px; }
.cbar > span:last-child { border-radius: 0 4px 4px 0; }
.cbar > span:only-child { border-radius: 4px; }
.sw-spent { background: var(--steel); }
.sw-over { background: var(--over); }
.sw-co { background: var(--context); }
.sw-left { background: var(--track); }
.sw-ohp { background: var(--accent); }
.cbar-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 22px; }
.cbar-legend > div { display: grid; grid-template-columns: 12px 1fr; column-gap: 9px; align-items: baseline; }
.cbar-legend i { width: 12px; height: 12px; border-radius: 3px; display: block; transform: translateY(1px); }
.cbar-legend .k { color: var(--ink-2); font-size: 13.5px; }
.cbar-legend .v { grid-column: 2; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.cbar-legend .p { grid-column: 2; color: var(--ink-3); font-size: 12.5px; }
.hero-note { margin: 14px 0 0; font-size: 13px; color: var(--ink-3); }
@media (max-width: 520px) {
  .cbar-legend { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .cbar-legend > div { grid-template-columns: 12px minmax(0, 1fr) auto; }
  .cbar-legend .v { grid-column: 3; grid-row: 1; font-size: 16px; }
  .cbar-legend .p { grid-column: 2 / 4; }
}

/* ---------- money rows ---------- */
.mtable { display: grid; container-type: inline-size; container-name: mt; }
.mhead, .mrow { display: grid; grid-template-columns: minmax(0, 1fr) 128px 128px 128px 112px; gap: 4px 14px; align-items: center; }
.mhead { padding: 0 0 8px; border-bottom: 1px solid var(--rule); }
.mhead span { font-stretch: 80%; font-size: 12.5px; color: var(--ink-3); text-align: right; letter-spacing: .015em; }
.mhead span:first-child { text-align: left; }
.mrow { padding: 11px 0; border-bottom: 1px solid var(--rule); text-align: left; width: 100%; background: transparent; border-left: 0;
  border-right: 0; border-top: 0; color: inherit; font: inherit; }
button.mrow:hover { background: var(--surface-2); }
button.mrow { padding-inline: 8px; margin-inline: -8px; width: calc(100% + 16px); border-radius: 6px; }
.mrow:last-child { border-bottom: 0; }
.mrow .name { min-width: 0; }
.mrow .name .t { font-weight: 600; overflow-wrap: anywhere; }
.mrow .name .s { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 3px; color: var(--ink-3); font-size: 12.5px; }
.mrow .name .code { font-stretch: 78%; font-weight: 600; color: var(--ink-2); font-size: 13px; letter-spacing: .02em; }
.mrow .name .note { color: var(--ink-3); font-size: 13px; margin-top: 3px; overflow-wrap: anywhere; }
.mrow .v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mrow .v .k { display: none; }
.mrow.total { font-weight: 700; }
.mrow.total .name .t { font-weight: 800; }
.meter { display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.used { display: grid; gap: 4px; justify-items: end; }
.used .pc { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tile .used { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; justify-items: stretch; }
@container mt (max-width: 680px) {
  .mhead, .mrow { grid-template-columns: minmax(0, 1fr) 104px 104px 104px; }
  .mhead span:last-child { display: none; }
  .mrow .used { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; justify-items: stretch; }
}
@container mt (max-width: 470px) {
  .mhead { display: none; }
  .mrow { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; }
  .mrow .name { grid-column: 1 / -1; }
  .mrow .v { text-align: left; }
  .mrow .v .k { display: block; font-stretch: 80%; font-size: 12px; color: var(--ink-3); }
}
.meter > span { display: block; height: 100%; border-radius: 3px; background: var(--steel); }
.meter.warn > span { background: var(--warn-fill); }
.meter.over > span { background: var(--over); }
.meter.ohp > span { background: var(--accent); }

/* ---------- attention ---------- */
.alist { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.alist li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 11px 12px; border-radius: 8px;
  background: var(--surface-2); }
.alist .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; margin-top: 1px; }
.alist .critical .ico { background: var(--over); color: var(--on-over); }
.alist .warning .ico { background: var(--warn-fill); color: #241a00; }
.alist .info .ico { background: var(--track); color: var(--ink-2); }
.alist .t { font-weight: 600; }
.alist .d { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
.alist .sev { font-stretch: 80%; font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
.empty-ok { color: var(--ink-2); padding: 6px 0; }

/* ---------- stats strip ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 22px; }
.stat .k { font-stretch: 80%; font-size: 13px; color: var(--ink-2); letter-spacing: .015em; }
.stat .v { font-size: 21px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; }
.stat .s { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }

/* ---------- lists ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.toolbar .grow { flex: 1 1 220px; min-width: 0; }
.search { width: 100%; min-height: 38px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--surface);
  padding: 7px 12px; }
.lgroup + .lgroup { margin-top: 6px; }
.lgroup-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 14px 0 6px;
  border-bottom: 1px solid var(--rule); font-weight: 700; }
.lgroup-head .r { display: flex; gap: 14px; color: var(--ink-2); font-weight: 600; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.lrow { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 4px 14px; width: 100%; text-align: left; padding: 11px 8px;
  margin-inline: -8px; width: calc(100% + 16px); border: 0; border-bottom: 1px solid var(--rule); background: transparent; border-radius: 6px; align-items: start; }
.lrow:hover { background: var(--surface-2); }
.lrow .d { color: var(--ink-2); font-size: 13.5px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.lrow .m { min-width: 0; }
.lrow .m .t { font-weight: 600; overflow-wrap: anywhere; }
.lrow .m .s { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--ink-3); font-size: 13px; margin-top: 3px; }
.lrow .m .n { color: var(--ink-3); font-size: 13px; margin-top: 3px; font-style: italic; overflow-wrap: anywhere; }
.lrow .a { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lrow.noteonly .m .t { font-weight: 500; font-style: italic; color: var(--ink-2); }
.lrow.crew { padding-block: 9px; }
.lrow.crew .m { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.lrow.crew .m .s, .lrow.crew .m .n { margin-top: 0; }
.more { margin-top: 12px; }
.rent { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.rent:last-child { border-bottom: 0; }
.rent .m { min-width: 0; flex: 1 1 260px; }
.rent .t { font-weight: 600; overflow-wrap: anywhere; }
.rent .s { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--ink-3); font-size: 13px; margin-top: 3px; }
.rent .r { display: flex; gap: 6px; }
.lrow.nodate { grid-template-columns: minmax(0, 1fr) auto; }
.list-foot { display: flex; justify-content: space-between; gap: 12px; padding-top: 12px; color: var(--ink-2); font-size: 13.5px; }
.empty { text-align: left; padding: 22px 4px; color: var(--ink-2); }
.empty b { color: var(--ink); }

/* ---------- line cards (materials and equipment by line) ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { text-align: left; border: 1px solid var(--rule); background: var(--surface); border-radius: 9px; padding: 13px 14px; display: grid; gap: 7px; color: inherit; }
button.tile:hover { border-color: var(--ink-3); }
.tile[aria-pressed="true"] { border-color: var(--brand-text); box-shadow: inset 0 0 0 1px var(--brand-text); }
.tile .t { font-weight: 700; overflow-wrap: anywhere; }
.tile .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tile .row b { color: var(--ink); font-weight: 700; }

/* ---------- progress notes ---------- */
.fchips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
.fchip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 999px;
  padding: 5px 11px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.fchip .n { font-variant-numeric: tabular-nums; color: var(--ink-3); font-weight: 600; }
.fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.fchip[aria-pressed="true"] .n { color: var(--surface); opacity: .7; }
.fchip[disabled] { opacity: .45; cursor: default; }
.nrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; border-bottom: 1px solid var(--rule); }
.nrow:last-child { border-bottom: 0; }
.nmain { display: grid; gap: 5px; text-align: left; border: 0; background: transparent; color: inherit; font: inherit; padding: 12px 8px; margin-inline: -8px;
  border-radius: 6px; min-width: 0; }
.nmain:hover { background: var(--surface-2); }
.nact { padding-top: 10px; }
.ntop { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.ndate { font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.ncat { display: inline-flex; align-items: center; border-radius: 4px; padding: 1px 7px; font-size: 12.5px; font-weight: 700; font-stretch: 88%; letter-spacing: .01em;
  background: var(--surface-2); color: var(--ink-2); }
.ncat.c-progress { background: var(--good-soft); color: var(--good); }
.ncat.c-client { background: var(--accent-soft); color: var(--accent); }
.ncat.c-change { background: var(--warn-soft); color: var(--warn); }
.ncat.c-issue { background: var(--over-soft); color: var(--over); }
.ncat.c-material { background: var(--track); color: var(--ink); }
.nfrom { color: var(--ink-2); font-size: 13px; }
.ntext { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
.nmeta { color: var(--ink-3); font-size: 12.5px; }
.nrow.open .ntext { font-weight: 500; }

/* ---------- projects ---------- */
.pgroup { display: grid; gap: 10px; }
.pgroup-head { display: flex; align-items: baseline; gap: 10px; }
.pgroup-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.pgroup-head .n { color: var(--ink-3); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 272px), 1fr)); gap: 14px; }
.pcard { text-align: left; border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-card); padding: 14px 16px 13px;
  display: grid; gap: 8px; align-content: start; color: inherit; font: inherit; width: 100%; min-width: 0; }
.pcard:hover { border-color: var(--ink-3); }
.pcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-height: 21px; }
.pcard .job { font-stretch: 78%; font-weight: 700; font-size: 13px; color: var(--ink-2); letter-spacing: .03em; }
.pcard .name { font-weight: 700; font-size: 16.5px; line-height: 1.25; overflow-wrap: anywhere; text-wrap: balance; }
.pcard .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pcard .row b { color: var(--ink); font-weight: 700; text-align: right; }
.pcard .used { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; justify-items: stretch; margin: 2px 0; }
.pcard .foot { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--rule); padding-top: 8px; margin-top: 2px; }
.pcard .foot .w { color: var(--warn); font-weight: 600; }
.pcard.closed .name, .pcard.closed .row b { color: var(--ink-2); }
.pcard[data-co] { border-top: 4px solid var(--co); padding-top: 11px; }
.pcard[data-co="uc"], .cdot.uc { --co: var(--co-uc); }
.pcard[data-co="asf"], .cdot.asf { --co: var(--co-asf); }
.pcard .co { margin-top: -5px; font-size: 13px; font-weight: 600; font-stretch: 90%; color: var(--ink-2); overflow-wrap: anywhere; }
.cdot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--co, var(--ink-3)); flex: none; }
.fchips.cofilter { margin: 0; }
details.pmore > summary { list-style: none; display: inline-flex; align-items: center; gap: 8px; }
details.pmore > summary::-webkit-details-marker { display: none; }
details.pmore > summary::before { content: "\25B8"; color: var(--ink-3); font-size: 13px; transition: transform .15s; }
details.pmore[open] > summary::before { transform: rotate(90deg); }
details.pmore[open] > .pgrid { margin-top: 10px; }
.pempty { display: grid; gap: 12px; justify-items: start; }
.pempty p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.progress { display: flex; gap: 10px; align-items: center; color: var(--ink-2); font-size: 13.5px; grid-column: 1 / -1; }
.progress .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--track); border-top-color: var(--brand-text); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.checks { grid-column: 1 / -1; display: grid; gap: 8px; }
@media (max-width: 560px) {
  .ptools { display: grid; gap: 10px; }
  .ptools .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ptools .btnrow .btn { white-space: normal; text-align: center; }
  .ptools .btnrow .primary { grid-column: 1 / -1; order: -1; }
  .ptools .btnrow .ghost { border-color: var(--rule); }
}

/* ---------- chart ---------- */
.chart { position: relative; margin-top: 6px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { fill: var(--ink-3); font-size: 11.5px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .base { stroke: var(--ink-3); stroke-width: 1; }
.chart .budget { stroke: var(--ink-2); stroke-width: 1; }
.chart .lab { fill: var(--ink-2); font-size: 12px; font-family: var(--font); font-weight: 600; }
.chart .lab.strong { fill: var(--ink); }
.chart .crew { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .crewfill { fill: var(--accent); opacity: .1; }
.chart .pay { stroke: var(--context); stroke-width: 2; fill: none; stroke-linejoin: round; }
.chart .dot-crew { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .dot-pay { fill: var(--context); stroke: var(--surface); stroke-width: 2; }
.chart .xhair { stroke: var(--ink-3); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 18px; height: 2px; display: inline-block; border-radius: 1px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  box-shadow: var(--shadow); padding: 9px 11px; font-size: 13px; min-width: 190px; z-index: 3; }
.tip .h { color: var(--ink-2); font-size: 12.5px; margin-bottom: 5px; }
.tip .r { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; }
.tip .r i { height: 2px; border-radius: 1px; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .r span { color: var(--ink-2); }
.tablewrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--rule); border-radius: 8px; max-height: 340px; }
table.data { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.data th, table.data td { padding: 7px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; text-align: right; }
table.data th { position: sticky; top: 0; background: var(--surface-2); font-stretch: 80%; font-weight: 600; color: var(--ink-2); }
table.data th:first-child, table.data td:first-child { text-align: left; }

/* ---------- forms & modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; }
.modal-back { position: absolute; inset: 0; background: var(--scrim); }
.modal-card:focus { outline: none; }
.modal-card { position: relative; width: min(560px, 100%); max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); display: flex; flex-direction: column;
  background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--rule); }
.modal-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 8px; font-size: 22px; line-height: 1; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); }
.modal form { overflow-y: auto; overscroll-behavior: contain; min-height: 0; padding: 16px 20px 0; display: flex; flex-direction: column; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 14px; align-items: start; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .field .label { font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.field input, .field select, .field textarea { width: 100%; min-height: 40px; border: 1px solid var(--rule); border-radius: var(--r-ctl);
  background: var(--surface); padding: 8px 11px; }
.field textarea { min-height: 64px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand-text); outline: 2px solid color-mix(in srgb, var(--brand-text) 28%, transparent); outline-offset: 0; }
.field .inp { position: relative; }
.field .inp input { padding-right: 44px; }
.field .inp .calc { position: absolute; right: 4px; top: 4px; bottom: 4px; width: 34px; border: 0; border-radius: 5px; background: var(--surface-2);
  color: var(--ink-2); font-weight: 700; font-size: 15px; }
.field .inp .calc[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-text); }
.field .hint { font-size: 12.5px; color: var(--ink-3); min-height: 0; }
.field .hint.err { color: var(--over); }
.field .hint.calc-ok { color: var(--brand-text); font-variant-numeric: tabular-nums; }
.field.invalid input { border-color: var(--over); }
.form-note { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.form-total { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 10px 12px;
  border-radius: 8px; background: var(--brand-soft); }
.form-total b { font-size: 18px; font-variant-numeric: tabular-nums; }
.crewgrid { grid-column: 1 / -1; display: grid; gap: 8px; }
.crewgrid .cr { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 12px; align-items: center; }
.crewgrid .cr label { font-weight: 600; }
.crewgrid .cr .bud { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 400; }
.form-actions { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 14px 0 16px; margin-top: 16px; background: var(--surface); border-top: 1px solid var(--rule); }
.form-actions .r { display: flex; gap: 8px; margin-left: auto; }
.form-err { color: var(--over); font-size: 13.5px; grid-column: 1 / -1; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); }

function compute(d) {

function runway(m, d, hol) {

        d: money(L.cost) + ' of ' + money(L.est) + (L.src === 'material' ? ' logged in materials.' : L.src === 'payroll' ? ' in payroll.' : '.') });
    } else if (L.est > 0 && L.cost / L.est >= 0.9) {

    } else if (used >= 0.8) {

  });

  var ue = m.equipment.filter(function (x) { return !eqNames[keyOf(x.r.item)]; });

/* =========================================================== burn chart */
function burnSeries() {
  var m = model(), d = state.data;
  var daily = {};
  m.labor.forEach(function (x) { if (x.r.date && x.total) daily[x.r.date] = (daily[x.r.date] || 0) + x.total; });
  var payCodes = {};
  m.payLines.forEach(function (L) { if (keyOf(L.r.code)) payCodes[keyOf(L.r.code)] = true; });
  var pdaily = {};
  d.payroll.forEach(function (p) { if (p.period && payCodes[keyOf(p.code)]) pdaily[p.period] = (pdaily[p.period] || 0) + val(p.cost); });
  var cd = Object.keys(daily).sort(), pd = Object.keys(pdaily).sort();
  var crew = [], c = 0;
  cd.forEach(function (k) { c += daily[k]; crew.push({ date: k, day: daily[k], cum: c }); });
  var pay = [], p = 0;
  pd.forEach(function (k) { p += pdaily[k]; pay.push({ date: k, cum: p }); });
  return { crew: crew, pay: pay, budget: m.laborBudget };
}
function payAt(pay, date) { var v = 0; pay.forEach(function (x) { if (x.date <= date) v = x.cum; }); return v; }
function burnTable() {
  var s = burnSeries();
  if (!s.crew.length) return '';
  return '<div class="tablewrap"><table class="data"><thead><tr><th>Date</th><th>Crew log that day</th><th>Crew log to date</th><th>Payroll to date</th><th>Estimate left</th></tr></thead><tbody>' +
    s.crew.slice().reverse().map(function (x) {
      return '<tr><td>' + esc(fmtDay(x.date)) + '</td><td>' + money(x.day) + '</td><td>' + money(x.cum) + '</td><td>' + money(payAt(s.pay, x.date)) + '</td><td class="' + moneyCls(s.budget - x.cum) + '">' + money(s.budget - x.cum) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
function niceStep(max, n) {
  var raw = max / n, mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), r = raw / mag;
  return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
}
var chartState = { pts: null, idx: -1 };
function drawCharts() {
  var host = $('#burnChart');
  if (!host) return;
  var s = burnSeries();
  if (!s.crew.length && !s.pay.length) { host.innerHTML = ''; return; }
  var W = Math.max(280, host.clientWidth || 600), H = W < 520 ? 210 : 250;
  var ml = 46, mr = W < 520 ? 12 : 104, mt = 22, mb = 26, pw = W - ml - mr, ph = H - mt - mb;
  var dates = s.crew.map(function (x) { return x.date; }).concat(s.pay.map(function (x) { return x.date; })).sort();
  var d0 = dates[0], d1 = dates[dates.length - 1];
  var t0 = dateOf(d0).getTime(), t1 = Math.max(dateOf(d1).getTime(), t0 + 86400000 * 7);
  var maxY = Math.max(s.budget, s.crew.length ? s.crew[s.crew.length - 1].cum : 0, s.pay.length ? s.pay[s.pay.length - 1].cum : 0) * 1.08 || 1;
  var step = niceStep(maxY, 5), top = Math.ceil(maxY / step) * step;
  function X(iso) { return ml + (dateOf(iso).getTime() - t0) / (t1 - t0) * pw; }
  function Y(v) { return mt + ph - v / top * ph; }
  var g = '';
  for (var v = 0; v <= top + 1e-6; v += step) {
    g += '<line class="' + (v === 0 ? 'base' : 'grid') + '" x1="' + ml + '" x2="' + (ml + pw) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>' +
      '<text class="ax" x="' + (ml - 8) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + compact(v) + '</text>';
  }
  var maxTicks = Math.max(2, Math.floor(pw / 70)), spanDays = (t1 - t0) / 86400000;
  var weeks = [1, 2, 4, 8, 13, 26].filter(function (w) { return spanDays / (w * 7) <= maxTicks; })[0] || 52;
  var first = dateOf(d0); first.setDate(first.getDate() + ((8 - first.getDay()) % 7));
  for (var t = new Date(first); t.getTime() <= t1; t.setDate(t.getDate() + 7 * weeks)) {

/** Budget lines for a new project, copied from another one. */
function copyOps(src, v) {
  var sections = [];
  if (v.cpGen) sections.push('general requirements');
  if (v.cpScope) sections.push('scope');
  var ops = [];
  compute(src).lines.forEach(function (L) {
    if (sections.indexOf(keyOf(L.r.section)) < 0) return;
    ops.push(add('budget', { id: uid('budget'), section: L.r.section, code: L.r.code, item: L.r.item, type: L.r.type, estimate: '',
      source: L.r.source, cost: '', notes: '', sort: L.r.sort }));
  });
  return ops;
}
function projectData(id) {
  if (!id) return Promise.resolve(null);
  if (PREVIEW) return Promise.resolve(pv.data(id));
  if (id === state.pid && state.data && state.ready) return Promise.resolve(state.data);
  var c = readCache(id);
  if (c) return Promise.resolve(normData(c.data));
  return queueNet(function () { return call('load', { project: id }); }).then(function (res) {
    var d = freshFrom(res, id);
    store.set(KEYS.cache + id, { v: 2, url: state.conn.url, data: d, meta: metaFrom(res), at: Date.now() });
    return d;
  });
}
function createProjectFlow(v) {
  var before = {};
  state.projects.forEach(function (e) { before[e.id] = true; });
  return projectData(v.copyFrom).then(function (src) {
    var settings = { company: v.company, address: v.address, start: v.start, contract: v.contract };
    if (src) { settings.hours = src.settings.hours; settings.rate = src.settings.rate; }
    Object.keys(settings).forEach(function (k) { if (isBlank(settings[k])) delete settings[k]; });
    var ops = src ? copyOps(src, v) : [];
    var data = normData({ settings: Object.assign({ name: v.name, job: v.job }, settings), tables: {} });
    var done = function (e) {
      enterProject(e.id, data);
      state.ui.tab = 'overview'; saveUi();
      if (ops.length) commit(ops, null); else { if (PREVIEW) pv.save(e.id, data); else saveCache(); render(); }
      setHash('overview'); window.scrollTo(0, 0);
      if (!PREVIEW) load({ quiet: true }).catch(noop);
      toast('"' + v.name + '" created' + (ops.length ? ' with ' + ops.length + ' budget ' + plural(ops.length, 'line') + ' to fill in' : ''), 4200);
    };
    if (PREVIEW) {
      var id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      state.projects.push(normEntry({ id: id, job: v.job, name: v.name, company: v.company, status: 'Active' }));
      pvSaveList();
      done(findProject(id));
      return null;
    }
    return queueNet(function () { return call('createProject', { name: v.name, job: v.job, settings: settings }, { timeout: 150000 }); })
      .then(null, function (err) {
        if (!err || (err.code !== 'timeout' && err.code !== 'network')) throw err;
        // The answer was lost; the sheet may have been made anyway. Look before offering to try again.
        return loadProjects({ quiet: true }).then(function () {
          var hit = state.projects.filter(function (e) { return !before[e.id] && e.name === v.name && e.job === (v.job || ''); })[0];
          if (hit) return { project: hit };
          throw err;
        }, function () { throw err; });
      })
      .then(function (res) { done(upsertProject(res.project)); });
  });
}
